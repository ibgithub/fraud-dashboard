# Non-sensitive configuration shared by the backend services.
# Sensitive values (DB password, JWT secret) live in the Secret, NOT here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: anvaia-config
  namespace: anvaia
data:
  # --- Auth-service DB (schema auth on RDS 'anvaia') ---
  DB_HOST: "dashboard-db.cd4a0agkih3m.ap-southeast-3.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_NAME: "anvaia"
  DB_USER: "anvaia"

  # --- Analytics-service DB (RDS 'altair_demo') ---
  EXEC_DB_HOST: "dashboard-db.cd4a0agkih3m.ap-southeast-3.rds.amazonaws.com"
  EXEC_DB_PORT: "5432"
  EXEC_DB_NAME: "altair_demo"
  EXEC_DB_USER: "postgres"

  FLYWAY_ENABLED: "true"
  SWAGGER_ENABLED: "false"
  JWT_EXPIRATION: "28800000"

  # Production CORS origins — replace with your real domain once Route53/ACM is set.
  CORS_ALLOWED_ORIGINS: "https://anvaia.example.com"
