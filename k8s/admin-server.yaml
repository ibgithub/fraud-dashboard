apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-server
  namespace: anvaia
  labels:
    app: admin-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-server
  template:
    metadata:
      labels:
        app: admin-server
    spec:
      containers:
        - name: admin-server
          image: 968603941297.dkr.ecr.ap-southeast-3.amazonaws.com/anvaia/admin-server:latest
          ports:
            - containerPort: 8083
          env:
            # Login credentials for the dashboard (Spring Boot Admin form login).
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: ADMIN_USER
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "500m"
              memory: "768Mi"
          # Context path is /admin, so actuator lives under /admin/actuator.
          startupProbe:
            httpGet:
              path: /admin/actuator/health/readiness
              port: 8083
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /admin/actuator/health/liveness
              port: 8083
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /admin/actuator/health/readiness
              port: 8083
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: admin-server
  namespace: anvaia
  labels:
    app: admin-server
spec:
  type: ClusterIP
  selector:
    app: admin-server
  ports:
    - port: 8083
      targetPort: 8083
      protocol: TCP
