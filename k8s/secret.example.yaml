# TEMPLATE ONLY — do NOT commit real secrets. Copy to secret.yaml, fill values,
# and apply with `kubectl apply -f secret.yaml` (keep secret.yaml out of git).
#
# For production, prefer AWS Secrets Manager + the External Secrets Operator or
# the Secrets Store CSI Driver instead of a plain Secret. This file is the
# simplest starting point.
#
# Generate a strong JWT secret:  openssl rand -base64 48
apiVersion: v1
kind: Secret
metadata:
  name: anvaia-secrets
  namespace: anvaia
type: Opaque
stringData:
  # Same JWT secret for auth-service and analytics-service (analytics validates
  # tokens issued by auth).
  JWT_SECRET: "REPLACE_WITH_openssl_rand_base64_48"

  # Auth-service DB password (RDS 'anvaia').
  DB_PASSWORD: "REPLACE_ME"

  # Analytics-service DB password (RDS 'altair_demo').
  EXEC_DB_PASSWORD: "REPLACE_ME"

  # Spring Boot Admin dashboard login (served at /admin behind the ALB).
  # Also used by auth-service/analytics-service to register with the dashboard.
  ADMIN_USER: "admin"
  ADMIN_PASSWORD: "REPLACE_WITH_A_STRONG_PASSWORD"
