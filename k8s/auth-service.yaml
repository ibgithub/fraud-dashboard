apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: anvaia
  labels:
    app: auth-service
spec:
  replicas: 2
  # Replace one pod at a time (no surge) so a rollout never doubles the number
  # of DB connections against the small shared RDS instance.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          # Replace 968603941297/<REGION> with your ECR repo URI.
          image: 968603941297.dkr.ecr.ap-southeast-3.amazonaws.com/anvaia/auth-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: anvaia-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: JWT_SECRET
            # Register with Spring Boot Admin (monitoring dashboard).
            - name: SBA_CLIENT_ENABLED
              value: "true"
            - name: SBA_URL
              value: "http://admin-server:8083/admin"
            - name: SBA_INSTANCE_BASE_URL
              value: "http://auth-service:8081"
            - name: SBA_USER
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: ADMIN_USER
            - name: SBA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          # Kubernetes probes hit Spring Actuator health groups (permitted in SecurityConfig).
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: anvaia
  labels:
    app: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
