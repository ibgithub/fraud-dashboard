apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: anvaia
  labels:
    app: analytics-service
spec:
  replicas: 2
  # Replace one pod at a time (no surge) so a rollout never doubles the number
  # of DB connections against the small shared RDS instance.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
    spec:
      containers:
        - name: analytics-service
          image: 968603941297.dkr.ecr.ap-southeast-3.amazonaws.com/anvaia/analytics-service:latest
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: anvaia-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: DB_PASSWORD
            - name: EXEC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: EXEC_DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: JWT_SECRET
            # Register with Spring Boot Admin (monitoring dashboard).
            - name: SBA_CLIENT_ENABLED
              value: "true"
            - name: SBA_URL
              value: "http://admin-server:8083/admin"
            - name: SBA_INSTANCE_BASE_URL
              value: "http://analytics-service:8082"
            - name: SBA_USER
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: ADMIN_USER
            - name: SBA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: anvaia-secrets
                  key: ADMIN_PASSWORD
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1500m"
              memory: "1536Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: anvaia
  labels:
    app: analytics-service
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - port: 8082
      targetPort: 8082
      protocol: TCP
