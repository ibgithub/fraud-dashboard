server:
  port: 9091

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:anvaia}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: auth
    schemas: auth,ods,public

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:28800000} # 8 jam
springdoc:
  # Swagger disabled in prod.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  file:
    name: /home/oper/dashboard/backend/logs/auth-service.log
  level:
    com.ib.auth: INFO
    org.springframework.web: WARN
