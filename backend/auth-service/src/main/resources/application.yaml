server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    # DB_USER / DB_PASSWORD have no defaults — must be provided via environment.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:anvaia}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      # The RDS instance is small and shared. Keep each pod's pool tiny so that
      # replicas + rolling updates don't exhaust RDS connection slots
      # (FATAL: remaining connection slots are reserved for "rds_reserved").
      maximum-pool-size: ${DB_POOL_MAX:3}
      minimum-idle: ${DB_POOL_MIN:1}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: auth
    schemas: auth,ods,public

jwt:
  # No default: JWT_SECRET MUST be provided via environment. App fails to start
  # if missing, preventing a weak/shared secret from ever being used.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:28800000} # 8 jam
springdoc:
  # Swagger/OpenAPI disabled by default; enable only in non-prod via env.
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
    path: /api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    path: /swagger
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

cors:
  # No wildcard fallback. Default to local dev origins only; production origins
  # are supplied via CORS_ALLOWED_ORIGINS env.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Spring Boot Admin client registration. Disabled by default (local dev);
# enabled in the cluster via SBA_CLIENT_ENABLED=true + SBA_URL pointing at the
# admin-server service. The admin server scrapes this app's /actuator endpoints
# over the internal cluster network only (not exposed via the ALB ingress).
spring.boot.admin.client:
  enabled: ${SBA_CLIENT_ENABLED:false}
  url: ${SBA_URL:http://localhost:8083/admin}
  username: ${SBA_USER:admin}
  password: ${SBA_PASSWORD:admin}
  instance:
    service-base-url: ${SBA_INSTANCE_BASE_URL:http://auth-service:8081}

# Actuator: health (for k8s probes) plus endpoints the admin dashboard displays.
# These are reachable only inside the cluster; the ingress never routes /actuator.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,mappings,beans,threaddump
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  info:
    env:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true