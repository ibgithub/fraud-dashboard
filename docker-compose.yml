services:
  postgres:
    image: postgres:16-alpine
    container_name: anvaia-bag-postgres
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5435}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-anvaia_bag}
      - POSTGRES_USER=${DB_USER:-anvaia}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-anvaia}
    volumes:
      - anvaia-bag-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anvaia} -d ${DB_NAME:-anvaia_bag}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anvaia-bag-network

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: anvaia-bag-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-4041}:8081"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-anvaia_bag}
      - DB_USER=${DB_USER:-anvaia}
      - DB_PASSWORD=${DB_PASSWORD:-anvaia}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:-my-super-secret-key-minimum-32-bytes!!!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://192.168.144.114:4000,http://localhost,http://localhost:4000,http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anvaia-bag-network

  analytics-service:
    build:
      context: ./backend/analytics-service
      dockerfile: Dockerfile
    container_name: anvaia-bag-analytics-service
    restart: unless-stopped
    ports:
      - "${EXECUTIVE_PORT:-4042}:8082"
    environment:
      - DB_HOST=${EXEC_DB_HOST:-192.168.144.114}
      - DB_PORT=${EXEC_DB_PORT:-5432}
      - DB_NAME=${EXEC_DB_NAME:-demo_bali}
      - DB_USER=${EXEC_DB_USER:-postgres}
      - DB_PASSWORD=${EXEC_DB_PASSWORD:-postgres}
      - EXEC_DB_HOST=${EXEC_DB_HOST:-192.168.144.114}
      - EXEC_DB_PORT=${EXEC_DB_PORT:-5432}
      - EXEC_DB_NAME=${EXEC_DB_NAME:-demo_bali}
      - EXEC_DB_USER=${EXEC_DB_USER:-postgres}
      - EXEC_DB_PASSWORD=${EXEC_DB_PASSWORD:-postgres}
      - JWT_SECRET=${JWT_SECRET:-my-super-secret-key-minimum-32-bytes!!!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://192.168.144.114:4000,http://localhost,http://localhost:4000,http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anvaia-bag-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anvaia-bag-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-4000}:80"
    depends_on:
      - auth-service
      - analytics-service
    networks:
      - anvaia-bag-network

volumes:
  anvaia-bag-pgdata:

networks:
  anvaia-bag-network:
    driver: bridge
