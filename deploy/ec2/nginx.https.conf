# ==============================================================================
# Production nginx config (HTTPS) for the frontend container on EC2.
# Serves the SPA and reverse-proxies /api to the backend services.
# Includes security headers (HSTS, CSP, X-Frame-Options, etc.).
# NOTE: TLS cert here is self-signed; replace with an ACM/CA cert + real domain
#       for a browser-trusted "secure" padlock.
# ==============================================================================

# Redirect all HTTP to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # ---- Security headers (applied to all responses, incl. errors) ----
    # Force HTTPS for 1 year (HSTS). Safe because HTTP already 301-redirects.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Prevent MIME-type sniffing.
    add_header X-Content-Type-Options "nosniff" always;
    # Disallow embedding in frames (clickjacking protection).
    add_header X-Frame-Options "DENY" always;
    # Limit referrer leakage.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Lock down powerful browser features not used by the app.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content Security Policy. SPA is same-origin; styles use inline (Tailwind),
    # images allow data: (inline SVG/base64). Scripts restricted to self.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Re-resolve backend container names via Docker's embedded DNS. Without this,
    # nginx caches the backend IPs at startup and every backend recreate breaks
    # /api with "connection refused" until the frontend is restarted.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $analytics_upstream http://analytics-service:8082;
    set $auth_upstream      http://auth-service:8081;

    # Proxy to Executive Service (demographic, portfolio, etc.)
    # (proxy_pass with a variable and no URI part forwards the original URI unchanged)
    location /api/v1/executive {
        proxy_pass $analytics_upstream;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to Auth Service (auth, users, roles, menus, settings)
    location /api {
        proxy_pass $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html must never be cached so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }
    # Frontend Single Page App routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
