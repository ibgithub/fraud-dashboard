# ==============================================================================
# fraud-dashboard — EC2 deployment (no local Postgres; uses RDS).
#
# Run from the repo root on the server:
#   docker compose -f deploy/ec2/docker-compose.ec2.yml --env-file .env up -d --build
#
# Frontend is NOT built on the server (small RAM). Build locally, then copy the
# Vite output to ./frontend-dist on the server; nginx serves it via a bind mount.
# TLS cert/key live in ./certs (git-ignored, generated on the server).
# ==============================================================================
name: fraud-dashboard

services:
  auth-service:
    build:
      context: ../../backend/auth-service
      dockerfile: Dockerfile
    container_name: fraud-auth-service
    restart: unless-stopped
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
    networks:
      - fraud-network

  analytics-service:
    build:
      context: ../../backend/analytics-service
      dockerfile: Dockerfile
    container_name: fraud-analytics-service
    restart: unless-stopped
    environment:
      - EXEC_DB_HOST=${EXEC_DB_HOST}
      - EXEC_DB_PORT=${EXEC_DB_PORT:-5432}
      - EXEC_DB_NAME=${EXEC_DB_NAME}
      - EXEC_DB_USER=${EXEC_DB_USER}
      - EXEC_DB_PASSWORD=${EXEC_DB_PASSWORD}
      # Secondary (bag) datasource. User/password fall back to EXEC_DB_* when
      # BAG_DB_* is not set (never pass an empty value: Spring would use it as-is).
      - BAG_DB_NAME=${BAG_DB_NAME:-bag_demo}
      - BAG_DB_USER=${BAG_DB_USER:-${EXEC_DB_USER}}
      - BAG_DB_PASSWORD=${BAG_DB_PASSWORD:-${EXEC_DB_PASSWORD}}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-false}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - SWAGGER_ENABLED=${SWAGGER_ENABLED:-false}
    networks:
      - fraud-network

  frontend:
    image: nginx:alpine
    container_name: fraud-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../frontend-dist:/usr/share/nginx/html:ro
      - ../../certs/selfsigned.crt:/etc/nginx/certs/selfsigned.crt:ro
      - ../../certs/selfsigned.key:/etc/nginx/certs/selfsigned.key:ro
      - ./nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - analytics-service
    networks:
      - fraud-network

networks:
  fraud-network:
    driver: bridge
