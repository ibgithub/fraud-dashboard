{{define "content"}}
{{if .Error}}<div class="banner err">Gagal membaca riwayat: {{.Error}}</div>{{end}}
{{if not .Imports}}
  <p class="empty">Belum ada riwayat upload.</p>
{{else}}
  <div class="tablewrap"><table><thead><tr>
    <th>#</th><th>Nama File</th><th>Jumlah Baris</th><th>Waktu Impor</th></tr></thead><tbody>
    {{range .Imports}}<tr><td class="mono">{{.ID}}</td><td>{{.FileName}}</td><td>{{.RowCount}}</td><td>{{.ImportedAt}}</td></tr>{{end}}
  </tbody></table></div>
{{end}}
{{end}}
